version: 2

updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      entity-framework:
        patterns:
          - 'Microsoft.EntityFrameworkCore*'
          - 'Npgsql*'
      testing:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'Moq'
          - 'coverlet*'

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      tooling:
        patterns:
          - 'vite'
          - 'vitest'
          - 'eslint*'
          - '@vitejs/*'
          - 'tailwindcss'
          - '@tailwindcss/*'

  - package-ecosystem: pip
    directory: /src/data-engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
