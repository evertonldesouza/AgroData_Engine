name: ✨ Ideia / melhoria
description: Proposta de funcionalidade ou refatoração
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Descreva o contexto antes da solução.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposta
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false

  - type: checkboxes
    id: architecture
    attributes:
      label: Impacto
      options:
        - label: Muda contrato entre módulos (exige ADR)
        - label: Exige mudança de schema / migration
        - label: Adiciona dependência externa
