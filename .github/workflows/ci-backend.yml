name: CI · Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'src/backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet restore src/backend/AgroData.slnx 2>&1 | tee restore.log

      - name: Report restore failure
        if: steps.restore.outcome == 'failure'
        run: |
          echo "### Restore failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|NU[0-9]+" restore.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|NU[0-9]+" restore.log | head -10 | while IFS= read -r line; do
            echo "::error title=restore::$line"
          done
          exit 1

      - name: Build
        id: build
        run: |
          set -o pipefail
          dotnet build src/backend/AgroData.slnx --configuration Release --no-restore 2>&1 | tee build.log

      - name: Report build diagnostics
        if: failure()
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error [A-Z]+[0-9]+" build.log | sort -u | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error [A-Z]+[0-9]+" build.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error title=build::$line"
          done

      - name: Test
        run: >
          dotnet test src/backend/AgroData.Tests
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./artifacts
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./artifacts
          retention-days: 7
