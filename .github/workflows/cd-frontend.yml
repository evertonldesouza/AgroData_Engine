name: Deploy · Frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/cd-frontend.yml'
  workflow_dispatch:

# Pages in this repository is served from the `gh-pages` branch
# (Settings → Pages → "Deploy from a branch"), so the job publishes the build
# output there instead of using the artifact-based deploy action.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: src/frontend

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Repository variable allows switching the API host without a commit.
          VITE_API_URL: ${{ vars.API_BASE_URL || 'https://agro-data-engine.onrender.com' }}

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # .nojekyll keeps every asset path intact (Jekyll would drop files
          # starting with an underscore).
          touch dist/.nojekyll

          cd dist
          git init --quiet
          git checkout --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "deploy: dashboard ${COMMIT_SHA:0:7}"

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force --quiet "$remote" gh-pages

      - name: Deployment summary
        run: |
          echo "### Dashboard publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
