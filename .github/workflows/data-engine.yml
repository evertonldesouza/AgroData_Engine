name: Agro Data Ingestion

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r src/scripts/requirements.txt
      - name: Run Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PYTHON }}
        run: python src/scripts/main_pipeline.py