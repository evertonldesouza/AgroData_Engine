name: .NET Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies
        run: dotnet restore src/backend/AgroData.API

      - name: Build
        run: dotnet build src/backend/AgroData.API --no-restore --configuration Release

      - name: Run tests
        run: dotnet test src/backend/AgroData.Tests --configuration Release --no-restore --verbosity normal
