name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly disclosed CVE is caught even without a commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build C# (required by CodeQL)
        if: matrix.language == 'csharp'
        run: dotnet build src/backend/AgroData.slnx --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: .NET vulnerable packages
        run: |
          dotnet restore src/backend/AgroData.slnx
          dotnet list src/backend/AgroData.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -qiE "has the following vulnerable|has a known" vulnerable.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: npm audit (runtime dependencies)
        working-directory: src/frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The engine is installed from source, so its runtime requirements are read
      # from pyproject.toml instead of a lock file.
      - name: Collect engine requirements
        run: |
          python - <<'PY' > requirements.txt
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("src/data-engine/pyproject.toml").read_text())
          print("\n".join(project["project"]["dependencies"]))
          PY

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.txt --strict
