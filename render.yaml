services:
  - type: web
    name: agro-data-api
    runtime: docker
    plan: starter
    region: ohio
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: agro-data-frontend
    runtime: static
    plan: free
    buildCommand: "cd src/frontend && npm install && npm run build"
    staticPublishPath: "src/frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: https://agro-data-api.onrender.com
