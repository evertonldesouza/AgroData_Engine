# Render blueprint for the API. The dashboard is served by GitHub Pages
# (see .github/workflows/cd-frontend.yml).
services:
  - type: web
    name: agro-data-engine
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://evertonldesouza.github.io
