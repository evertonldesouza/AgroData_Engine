[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agrodata-engine"
version = "3.0.0"
description = "Ingestion + analytics engine that feeds the AgroData PostgreSQL warehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Everton L. de Souza" }]
keywords = ["etl", "commodities", "agritech", "postgresql", "pandas"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=2.2,<4",
  "psycopg[binary]>=3.1,<4",
  "psycopg2-binary>=2.9,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "tenacity>=8.3,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pandas-stubs",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-requests",
]

[project.scripts]
agrodata = "agrodata.cli:main"

[tool.setuptools.packages.find]
include = ["agrodata*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agrodata", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["agrodata"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["pandas.*", "tenacity.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=agrodata --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["agrodata"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
